<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="bgR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glowR">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowR">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="url(#bgR)" rx="16"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700">RAG Query Processing Flow</text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">From user query to cited answer — end-to-end retrieval pipeline</text>

  <!-- Step 1: User Query -->
  <rect x="50" y="100" width="200" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadowR)"/>
  <text x="150" y="125" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="700">1. User Query</text>
  <text x="150" y="145" text-anchor="middle" fill="#64748b" font-size="11">"How does RAG handle</text>
  <text x="150" y="158" text-anchor="middle" fill="#64748b" font-size="11">multi-hop reasoning?"</text>

  <!-- Arrow 1->2 -->
  <line x1="250" y1="130" x2="300" y2="130" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <!-- Step 2: Query Expansion (HyDE) -->
  <rect x="300" y="95" width="220" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadowR)"/>
  <text x="410" y="120" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">2. Query Expansion</text>
  <text x="410" y="138" text-anchor="middle" fill="#64748b" font-size="11">HyDE: LLM generates</text>
  <text x="410" y="151" text-anchor="middle" fill="#64748b" font-size="11">hypothetical answer → embed</text>
  <text x="410" y="164" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">3 expanded queries</text>

  <!-- Arrow 2->3 (splits into two paths) -->
  <line x1="520" y1="120" x2="570" y2="120" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="570" y1="120" x2="570" y2="100" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="570" y1="100" x2="630" y2="100" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="570" y1="120" x2="570" y2="160" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="570" y1="160" x2="630" y2="160" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowP)"/>

  <!-- Step 3a: Dense Retrieval -->
  <rect x="630" y="80" width="200" height="55" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#shadowR)"/>
  <text x="730" y="105" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">3a. Dense Retrieval</text>
  <text x="730" y="123" text-anchor="middle" fill="#64748b" font-size="11">Qdrant · cosine top-K=20</text>

  <!-- Step 3b: Sparse Retrieval -->
  <rect x="630" y="150" width="200" height="55" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" filter="url(#shadowR)"/>
  <text x="730" y="175" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="600">3b. Sparse Retrieval</text>
  <text x="730" y="193" text-anchor="middle" fill="#64748b" font-size="11">BM25 · keyword top-K=20</text>

  <!-- Arrows to fusion -->
  <line x1="830" y1="107" x2="870" y2="107" stroke="#34d399" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="830" y1="177" x2="870" y2="177" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- Step 4: Reciprocal Rank Fusion -->
  <rect x="870" y="90" width="180" height="80" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#shadowR)"/>
  <text x="960" y="115" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">4. Rank Fusion</text>
  <text x="960" y="133" text-anchor="middle" fill="#64748b" font-size="11">Reciprocal Rank Fusion</text>
  <text x="960" y="148" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">RRF(dense, sparse)</text>
  <text x="960" y="163" text-anchor="middle" fill="#64748b" font-size="11">→ top-50 candidates</text>

  <!-- Arrow down -->
  <line x1="960" y1="170" x2="960" y2="210" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowY)"/>

  <!-- Step 5: Cross-Encoder Reranker -->
  <rect x="820" y="210" width="280" height="65" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#glowR)"/>
  <text x="960" y="235" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="700">5. Cross-Encoder Reranking</text>
  <text x="960" y="253" text-anchor="middle" fill="#64748b" font-size="11">BGE-reranker-large scores (query, doc) pairs</text>
  <text x="960" y="268" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">→ top-5 high-quality chunks</text>

  <!-- Arrow left -->
  <line x1="820" y1="242" x2="770" y2="242" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowY)"/>

  <!-- Step 6: Context Builder -->
  <rect x="530" y="210" width="240" height="65" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadowR)"/>
  <text x="650" y="235" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">6. Context Builder</text>
  <text x="650" y="253" text-anchor="middle" fill="#64748b" font-size="11">Window expansion + dedup</text>
  <text x="650" y="268" text-anchor="middle" fill="#64748b" font-size="11">Token budget: 4096 tokens</text>

  <!-- Arrow left -->
  <line x1="530" y1="242" x2="480" y2="242" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <!-- Step 7: Prompt Assembly -->
  <rect x="240" y="210" width="240" height="65" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadowR)"/>
  <text x="360" y="235" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">7. Prompt Assembly</text>
  <text x="360" y="253" text-anchor="middle" fill="#64748b" font-size="11">System + context + history + query</text>
  <text x="360" y="268" text-anchor="middle" fill="#64748b" font-size="11">Citation instructions embedded</text>

  <!-- Arrow down -->
  <line x1="360" y1="275" x2="360" y2="315" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <!-- Step 8: DeepSeek LLM -->
  <rect x="220" y="315" width="280" height="80" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2.5" filter="url(#glowR)"/>
  <text x="360" y="345" text-anchor="middle" fill="#f9a8d4" font-size="15" font-weight="700">8. DeepSeek LLM Generation</text>
  <text x="360" y="365" text-anchor="middle" fill="#64748b" font-size="11">deepseek-v4-flash (default) / v4-pro (reasoning)</text>
  <text x="360" y="380" text-anchor="middle" fill="#64748b" font-size="11">Streaming tokens via SSE/WebSocket</text>
  <text x="360" y="395" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="600">Retry with exponential backoff (3 attempts)</text>

  <!-- Arrow down -->
  <line x1="360" y1="395" x2="360" y2="430" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrowP)"/>

  <!-- Step 9: Citation + Response -->
  <rect x="200" y="430" width="320" height="70" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadowR)"/>
  <text x="360" y="455" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">9. Citation &amp; Response</text>
  <text x="360" y="473" text-anchor="middle" fill="#64748b" font-size="11">Source attribution [1], [2] linked to chunks</text>
  <text x="360" y="488" text-anchor="middle" fill="#64748b" font-size="11">Confidence score + token usage metadata</text>

  <!-- Arrow right to output -->
  <line x1="520" y1="465" x2="580" y2="465" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <!-- Output -->
  <rect x="580" y="430" width="200" height="70" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#glowR)"/>
  <text x="680" y="460" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">User Response</text>
  <text x="680" y="478" text-anchor="middle" fill="#64748b" font-size="11">Answer + citations</text>
  <text x="680" y="493" text-anchor="middle" fill="#64748b" font-size="11">+ confidence + metadata</text>

  <!-- ==================== Performance Annotations ==================== -->
  <rect x="50" y="530" width="1000" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <text x="70" y="555" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">PERFORMANCE CHARACTERISTICS</text>

  <!-- Metric 1 -->
  <circle cx="100" cy="585" r="8" fill="#34d399" opacity="0.3"/>
  <circle cx="100" cy="585" r="4" fill="#34d399"/>
  <text x="120" y="590" fill="#e2e8f0" font-size="12">End-to-end latency: <tspan font-weight="700" fill="#6ee7b7">1.5–3.5s</tspan> (depending on LLM model)</text>

  <!-- Metric 2 -->
  <circle cx="100" cy="610" r="8" fill="#38bdf8" opacity="0.3"/>
  <circle cx="100" cy="610" r="4" fill="#38bdf8"/>
  <text x="120" y="615" fill="#e2e8f0" font-size="12">Retrieval precision@5: <tspan font-weight="700" fill="#7dd3fc">87.3%</tspan> (with cross-encoder reranking)</text>

  <!-- Metric 3 -->
  <circle cx="100" cy="635" r="8" fill="#c084fc" opacity="0.3"/>
  <circle cx="100" cy="635" r="4" fill="#c084fc"/>
  <text x="120" y="640" fill="#e2e8f0" font-size="12">HyDE expansion improves recall by: <tspan font-weight="700" fill="#d8b4fe">+23%</tspan> vs. single-query baseline</text>

  <!-- Metric 4 -->
  <circle cx="100" cy="660" r="8" fill="#fbbf24" opacity="0.3"/>
  <circle cx="100" cy="660" r="4" fill="#fbbf24"/>
  <text x="120" y="665" fill="#e2e8f0" font-size="12">Token cost per query: <tspan font-weight="700" fill="#fde68a">~2,100 tokens</tspan> (v4-flash: ¥0.004/query)</text>

  <!-- Metric 5 -->
  <circle cx="600" cy="585" r="8" fill="#f472b6" opacity="0.3"/>
  <circle cx="600" cy="585" r="4" fill="#f472b6"/>
  <text x="620" y="590" fill="#e2e8f0" font-size="12">RRF fusion combines dense + sparse: <tspan font-weight="700" fill="#f9a8d4">+31% recall</tspan> vs. dense-only</text>

  <!-- Metric 6 -->
  <circle cx="600" cy="610" r="8" fill="#10b981" opacity="0.3"/>
  <circle cx="600" cy="610" r="4" fill="#10b981"/>
  <text x="620" y="615" fill="#e2e8f0" font-size="12">Embedding inference: <tspan font-weight="700" fill="#6ee7b7">12ms/chunk</tspan> (BGE-small, local GPU)</text>

  <!-- Metric 7 -->
  <circle cx="600" cy="635" r="8" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="600" cy="635" r="4" fill="#8b5cf6"/>
  <text x="620" y="640" fill="#e2e8f0" font-size="12">Qdrant search: <tspan font-weight="700" fill="#c4b5fd">8ms</tspan> avg (HNSW, 100K vectors)</text>

  <!-- Metric 8 -->
  <circle cx="600" cy="660" r="8" fill="#ef4444" opacity="0.3"/>
  <circle cx="600" cy="660" r="4" fill="#ef4444"/>
  <text x="620" y="665" fill="#e2e8f0" font-size="12">Reranker inference: <tspan font-weight="700" fill="#fca5a5">45ms</tspan> for 50 candidate pairs</text>
</svg>
